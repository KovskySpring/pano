# Fixture for `shipped_config_test`: a realistic multi-atlas, multi-variant
# config. Relative paths resolve against this file's directory, and must stay
# within it (`..` may not climb above the config's own directory).

jar = "../vendor/runnable-texturepacker.jar"

# Shared output root: every atlas below omits its own `target_dir`, so each one
# writes to `../assets/textures/<atlas name>/`.
target_dir = "../assets/textures"

concurrency = 8
timeout = 120_000

# Root-level libGDX settings. TOML assigns bare keys to the table header above
# them, so these have to sit before the first `[atlases.*]` header.
max_width = 4096
max_height = 4096
bleed_iterations = 4

[atlases.default-resources]
source_dir = "../assets/original/images/default"

[atlases.default-resources.variants.1x]
scale_factor = 0.3472

[atlases.default-resources.variants.2x]
scale_factor = 0.69444

[atlases.default-resources.variants.2_88x]
scale_factor = 1.0

[atlases.effects-resources]
source_dir = "../assets/original/images/effects"

[atlases.effects-resources.variants.1x]
