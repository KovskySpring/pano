# Texture packing config, consumed by `gleam run` in dev/texture_packer.
# Relative paths resolve against this file's directory.
#
# Per atlas: `source_dir` is the source image directory, `target_dir` the
# output root, `scales` the output scale passes (all three required);
# `indexed` defaults to true.
# `GDX_OUT_ROOT` / `GDX_CONCURRENCY` env vars override `target_dir` /
# `concurrency`.
#
# The scale factors mirror the AutoSD settings baked into the original .tps
# files: source art is authored at 2.88x (factor 1.0), 1x / 2x are downscaled.

jar = "../../management/textures/vendor/runnable-texturepacker.jar"
concurrency = 8

[[atlases]]
name = "default-resources"
source_dir = "../../assets/original/images/default"
target_dir = "../../assets/textures"
scales = [
    { dir = "1x", factor = 0.3472 },
    { dir = "2x", factor = 0.69444 },
    { dir = "2.88x", factor = 1.0 },
]

